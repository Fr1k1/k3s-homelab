# Identity the controller pod runs as (config/manager/manager.yaml sets
# serviceAccountName: controller-manager). namespace: system is a
# Kustomize placeholder — config/default/kustomization.yaml's top-level
# `namespace:` field rewrites every namespaced object here (and in
# ../manager, ../crd) to the real namespace, config-reloader-system, at
# build time. `namePrefix: config-reloader-` in that same file is what
# turns this into the final name config-reloader-controller-manager.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-manager
  namespace: system
