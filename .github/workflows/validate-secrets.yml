name: Validate secrets

# Guardrail, not a generator: this workflow holds no secret material and
# never seals anything. It only fails the build if a plaintext Kubernetes
# Secret (instead of a SealedSecret) or a tracked .env file ever lands under
# apps/ -- the realistic failure mode being guarded against is a mis-run
# `kubectl create secret` (missing --dry-run) or an accidentally staged .env,
# not a sophisticated leak.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check-no-plaintext-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/seal-secret/check-no-plaintext-secrets.sh
