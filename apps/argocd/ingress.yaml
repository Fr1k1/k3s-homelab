apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
annotations:
  traefik.ingress.kubernetes.io/router.entrypoints: web
  argocd.argoproj.io/server-insecure: "true"
spec:
  rules:
    - host: argocd.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
