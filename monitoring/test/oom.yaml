apiVersion: v1
kind: Pod
metadata:
  name: oom
  namespace: monitoring-test
spec:
  restartPolicy: Always
  containers:
    - name: hog
      image: busybox:1.37
      command: ["sh", "-c", "x=a; while true; do x=\"$x$x\"; done"]
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 32Mi
