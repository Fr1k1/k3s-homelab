apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: monitoring-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
        - name: httpbin
          image: ghcr.io/mccutchen/go-httpbin:2.25.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: monitoring-test
spec:
  selector:
    app: httpbin
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: httpbin
  namespace: monitoring-test
spec:
  rules:
    - host: monitoring-test.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: httpbin
                port:
                  number: 80
